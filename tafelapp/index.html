<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="row justify-content-center">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-header">
                    Score
                </div>
                <div class="card-body">
                    <h2 id="score">0</h2>
                    <p>Goede antwoorden</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-header">
                    Tafel van ...
                </div>
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-md-3">
                            <label for="inputTafel" class="col-form-label">Welke tafel?</label>
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="inputTafel" class="form-control">
                        </div>
                        <div class="col">
                            <button
                              type="button"
                              class="btn btn-success"
                              onclick="startOefenen()"
                            >

                               GO!
                            </button>
                        </div>
                    </div>
                    <h3 class="card-text" id="som">Kies een tafel en klik op GO!</h3>
                        
                        <input
                          type="number"
                          id="antwoord"
                          class="form-control mb-2"
                          placeholder="Vul antwoord in"
                        >

                        <button
                           type="button"
                           class="btn btn-primary"
                           onclick="controleerAntwoord()"
                        >
                           controleer

                        </button>
                        <p id="feedback"></p>

                </div>
                <div class="card-footer text-body-secondary">
                    Made by Sef
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
              <div class="card-header">
                Tijd
            </div>
            <div class="card-body">
            <h2 id="tijd">00:00</h2>
            <p>Verstreken tijd</p>
        </div>
    </div>
</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="tafelapp.js"></script>
</body>

</html>
